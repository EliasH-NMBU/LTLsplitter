[project]
name = "ltlsplitter"
version = "0.0.1"
description = "GUI pipeline for LLM-assisted LTL decomposition from FRET imports, multi-model-checker validation, and Ogma ROS2 monitor export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "anthropic",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
ltlsplitter = "ltlsplitter.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltlsplitter"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
