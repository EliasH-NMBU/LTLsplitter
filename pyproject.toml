[project]
name = "ltlsplitter"
version = "0.0.1"
description = "GUI pipeline for splitting requirements into LTL/behavior-tree specs and deploying ROS2 runtime monitors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
]

[project.scripts]
ltlsplitter = "ltlsplitter.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltlsplitter"]

[tool.pytest.ini_options]
qt_api = "pyside6"
